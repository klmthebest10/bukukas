<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BukuKas Pro — Pembukuan Usaha</title>
<meta name="description" content="Aplikasi pembukuan usaha modern untuk warung, peternakan, jual beli buah, kuliner, jasa dan semua jenis usaha.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BukuKas">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f9;--surface:#ffffff;--surface-2:#f6f8fb;--surface-3:#eef2f7;
  --text:#0f172a;--text-2:#334155;--muted:#64748b;--line:#e3e8ef;
  --primary:#0f766e;--primary-2:#14b8a6;--primary-soft:#ccfbf1;--on-primary:#fff;
  --in:#059669;--in-soft:#d1fae5;--out:#dc2626;--out-soft:#fee2e2;
  --warn:#b45309;--warn-soft:#fef3c7;--info:#4338ca;--info-soft:#e0e7ff;
  --hero:linear-gradient(135deg,#0f766e 0%,#0d9488 45%,#3730a3 130%);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --shadow-lg:0 20px 50px rgba(15,23,42,.18);
  --r:18px;--r-sm:12px;--nav-h:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1a;--surface:#111827;--surface-2:#151d2e;--surface-3:#1b2539;
  --text:#e8edf5;--text-2:#cbd5e1;--muted:#8b98ad;--line:#232f45;
  --primary:#2dd4bf;--primary-2:#5eead4;--primary-soft:#123b38;--on-primary:#04201d;
  --in:#34d399;--in-soft:#0f3328;--out:#f87171;--out-soft:#3b1717;
  --warn:#fbbf24;--warn-soft:#3a2a0c;--info:#a5b4fc;--info-soft:#1e2350;
  --hero:linear-gradient(135deg,#0f4f4a 0%,#115e59 45%,#312e81 130%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a0f1a;--surface:#111827;--surface-2:#151d2e;--surface-3:#1b2539;
  --text:#e8edf5;--text-2:#cbd5e1;--muted:#8b98ad;--line:#232f45;
  --primary:#2dd4bf;--primary-2:#5eead4;--primary-soft:#123b38;--on-primary:#04201d;
  --in:#34d399;--in-soft:#0f3328;--out:#f87171;--out-soft:#3b1717;
  --warn:#fbbf24;--warn-soft:#3a2a0c;--info:#a5b4fc;--info-soft:#1e2350;
  --hero:linear-gradient(135deg,#0f4f4a 0%,#115e59 45%,#312e81 130%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{margin-top:16px}.mb{margin-bottom:16px}.gap-s{gap:6px}

/* ---------- full screens (setup/auth/wizard) ---------- */
#screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(1200px 600px at 10% -10%,rgba(20,184,166,.18),transparent 60%),radial-gradient(900px 500px at 110% 110%,rgba(79,70,229,.15),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.auth-card.wide{max-width:760px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand-logo{width:46px;height:46px;border-radius:14px;background:var(--hero);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 8px 20px rgba(15,118,110,.35)}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}.brand p{margin:0;color:var(--muted);font-size:13px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.type-card{border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:var(--surface-2);transition:.15s;text-align:left}
.type-card:hover{border-color:var(--primary-2)}
.type-card.on{border-color:var(--primary);background:var(--primary-soft)}
.type-card .e{font-size:26px}.type-card b{display:block;font-size:14px;margin-top:4px}.type-card span{font-size:12px;color:var(--muted)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;z-index:40}
.biz-switch{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.biz-switch .e{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:var(--surface);border:1px solid var(--line)}
.biz-switch b{display:block;font-size:14px}.biz-switch small{color:var(--muted);font-size:12px}
.nav{margin-top:14px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:14px;text-align:left}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--primary-soft);color:var(--primary)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.topbar h2{margin:0;font-size:20px;letter-spacing:-.02em}
.topbar .sub{font-size:12px;color:var(--muted)}
.content{padding:8px 28px 40px;max-width:1320px;width:100%}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--text-2);flex:none}
.icon-btn:hover{border-color:var(--primary-2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--out);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.mob-only{display:none}

/* bottom nav */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);align-items:center}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 0}
.bnav button.on{color:var(--primary)}
.bnav .fab{width:54px;height:54px;border-radius:18px;background:var(--hero);color:#fff;margin:-26px auto 0;box-shadow:0 10px 24px rgba(15,118,110,.45);display:grid;place-items:center}
.bnav .fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.45);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:15px;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--primary-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--out);border-color:color-mix(in srgb,var(--out) 35%,var(--line))}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg.i{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text-2)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.in{background:var(--in-soft);color:var(--in)}.pill.out{background:var(--out-soft);color:var(--out)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-3);color:var(--muted)}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);outline:none;transition:.15s;font-size:15px}
.inp:focus{border-color:var(--primary);background:var(--surface)}
textarea.inp{min-height:70px;resize:vertical}
.inp.big{font-size:26px;font-weight:800;padding:12px 14px;letter-spacing:-.02em}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-3);padding:4px;border-radius:14px;gap:4px;margin-bottom:14px}
.seg button{border:0;background:none;padding:9px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.in{color:var(--in)}.seg button.on.out{color:var(--out)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:14px;max-height:220px;overflow:auto}
.cat-opt{border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;cursor:pointer;background:var(--surface-2);font-size:12px;font-weight:600}
.cat-opt .e{font-size:20px;display:block}
.cat-opt.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.switch{position:relative;width:46px;height:27px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--surface-3);border:1px solid var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.switch i:before{content:"";position:absolute;width:21px;height:21px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked+i{background:var(--primary);border-color:var(--primary)}
.switch input:checked+i:before{transform:translateX(19px)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .t b{display:block;font-size:14px}.set-row .t small{color:var(--muted);font-size:12.5px}

/* hero / kpi */
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(15,118,110,.25)}
.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08);right:-80px;top:-120px}
.hero:before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);right:60px;bottom:-120px}
.hero .lbl{opacity:.85;font-size:13px;font-weight:600}
.hero .val{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px}
.acc-chips{display:flex;gap:8px;overflow-x:auto;position:relative;z-index:1;scrollbar-width:none}
.acc-chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:8px 12px;border-radius:12px;min-width:120px;flex:none}
.acc-chip small{display:block;opacity:.8;font-size:11.5px}.acc-chip b{font-size:14px}
.hero-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.hero-actions button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:10px 4px;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.hero-actions button:hover{background:rgba(255,255,255,.25)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.kpi .k-lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .k-val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.trend{font-size:12px;font-weight:700}
.trend.up{color:var(--in)}.trend.down{color:var(--out)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:210px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--surface-3)}
.li .t{font-weight:700;font-size:14px}.li .s{font-size:12.5px;color:var(--muted)}
.li .amt{font-weight:800;text-align:right;white-space:nowrap}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 6px;font-size:12.5px;font-weight:700;color:var(--muted);position:sticky;top:68px;background:var(--surface);z-index:1}
.empty{text-align:center;padding:36px 14px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:6px}
.prog{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.alert-item{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;align-items:flex-start}
.alert-item .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:16px}
.alert-item b{font-size:13.5px;display:block}.alert-item small{color:var(--muted);font-size:12.5px}
.lv-danger .ai{background:var(--out-soft)}.lv-warn .ai{background:var(--warn-soft)}.lv-info .ai{background:var(--info-soft)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.tbl-wrap{overflow-x:auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.insight:last-child{border:0}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:17px}

/* kasir */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;position:relative;transition:.12s;user-select:none;display:flex;flex-direction:column;gap:6px;min-height:118px}
.pcard:hover{border-color:var(--primary-2)}.pcard:active{transform:scale(.97)}
.pcard .pe{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:16px}
.pcard b{font-size:13.5px;line-height:1.3}
.pcard .pp{font-weight:800;color:var(--primary);font-size:14px;margin-top:auto}
.pcard .ps{font-size:11.5px;color:var(--muted)}
.pcard .q{position:absolute;top:8px;right:8px;background:var(--primary);color:var(--on-primary);min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.pcard.low .ps{color:var(--out);font-weight:700}
.cart{position:sticky;top:84px}
.cart-items{max-height:calc(100vh - 380px);overflow:auto}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:30px;height:30px;border:0;background:var(--surface-2);cursor:pointer;font-weight:800}
.qty input{width:44px;text-align:center;border:0;background:none;height:30px;font-weight:700;outline:none}
.cart-bar{display:none}
.total-line{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.pay-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.pay-opt{border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-weight:700;font-size:13px;background:var(--surface-2);text-align:center}
.pay-opt.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.quick-cash{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}

/* modal / sheet */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.5);backdrop-filter:blur(3px)}
#modal.open{display:flex}
.sheet{background:var(--surface);border-radius:22px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s ease-out;border:1px solid var(--line)}
.sheet.wide{max-width:760px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:17px}
.sheet-b{padding:18px;overflow:auto}
.sheet-f{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .2s}
.toast.err{background:var(--out);color:#fff}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:70;transform:translateX(105%);transition:.25s;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.loader{width:42px;height:42px;border-radius:50%;border:4px solid var(--surface-3);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:14px;white-space:pre-wrap}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-dash{grid-template-columns:1fr}
  .pos{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:286px;transform:translateX(-105%);transition:.25s;box-shadow:var(--shadow-lg);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.on{transform:none}
  .bnav{display:grid}
  .mob-only{display:grid}
  .desk-only{display:none!important}
  .topbar{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topbar h2{font-size:18px}
  .content{padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
  .pos{grid-template-columns:1fr}
  .pos .cart{display:none}
  .cart-bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:45;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:12px 16px;align-items:center;gap:10px;box-shadow:0 12px 28px rgba(15,118,110,.4);cursor:pointer;font-weight:700}
  #toast{bottom:calc(var(--nav-h) + var(--safe-b) + 20px)}
  .day-h{top:60px}
}
@media (max-width:640px){
  .g2,.g3{grid-template-columns:1fr}
  .g4{gap:10px}
  .card{padding:15px;border-radius:16px}
  .kpi .k-val{font-size:18px}
  .hero .val{font-size:28px}
  #modal{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{max-width:none;border-radius:22px 22px 0 0;max-height:94vh;animation:up .22s ease-out}
  .sheet-f{padding-bottom:calc(14px + var(--safe-b))}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-row{grid-template-columns:1fr 1fr}
  .tbl{font-size:13px}
  .hide-sm{display:none}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media print{
  body{background:#fff;color:#000}
  .side,.topbar,.bnav,.no-print,.cart-bar,#toast{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .print-only{display:block!important}
}
.print-only{display:none}
</style>
</head>
<body>
<div id="screen"><div class="loader"></div></div>
<div id="app" class="app hidden"></div>
<div id="scrim" class="scrim" onclick="closeOverlays()"></div>
<div id="drawer" class="drawer"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
