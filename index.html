<style>
/* =====================================================================
   TEMA: Glassmorphism (kartu kaca) + Neumorphism (tombol & input timbul)
   Aksen: biru (default) • hijau • emas (dark mewah). Mode: terang/gelap.
   ===================================================================== */
:root{
  --bg:#e8eef7;--bg-2:#dfe7f3;
  --glass:rgba(255,255,255,.68);--glass-strong:rgba(255,255,255,.86);--glass-border:rgba(255,255,255,.85);--glass-edge:rgba(15,23,42,.06);
  --surface:#f5f8fc;--surface-2:rgba(241,245,251,.85);--surface-3:#e4eaf3;
  --neu:#eaf0f8;--neu-hi:rgba(255,255,255,.95);--neu-lo:rgba(140,158,186,.45);
  --text:#0a1325;--text-2:#22314a;--muted:#55657e;--line:rgba(15,23,42,.09);
  --primary:#1d4ed8;--primary-2:#3b82f6;--primary-soft:rgba(37,99,235,.12);--on-primary:#fff;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 45%,#0ea5e9 115%);
  --in:#047857;--in-soft:rgba(16,185,129,.14);--out:#be123c;--out-soft:rgba(244,63,94,.13);
  --warn:#a16207;--warn-soft:rgba(234,179,8,.16);--info:#4338ca;--info-soft:rgba(99,102,241,.13);
  --c-in:#10b981;--c-out:#f43f5e;--c-line:#6366f1;
  --shadow:0 10px 30px rgba(30,41,59,.08),0 1px 2px rgba(30,41,59,.05);
  --shadow-lg:0 24px 60px rgba(15,23,42,.22);
  --r:20px;--r-sm:14px;--nav-h:70px;--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-accent="green"]{--primary:#047857;--primary-2:#10b981;--primary-soft:rgba(16,185,129,.14);--grad:linear-gradient(135deg,#064e3b 0%,#047857 45%,#14b8a6 115%);--c-line:#0ea5e9}
:root[data-accent="gold"]{--primary:#a16207;--primary-2:#d4a017;--primary-soft:rgba(212,160,23,.15);--on-primary:#1c1404;--grad:linear-gradient(135deg,#1c1917 0%,#44352a 40%,#b8860b 120%);--c-line:#d4a017}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060a13;--bg-2:#0a1120;
  --glass:rgba(17,25,43,.62);--glass-strong:rgba(19,28,48,.88);--glass-border:rgba(255,255,255,.08);--glass-edge:rgba(255,255,255,.04);
  --surface:#0f1729;--surface-2:rgba(24,34,57,.7);--surface-3:#1a2540;
  --neu:#111a2e;--neu-hi:rgba(255,255,255,.045);--neu-lo:rgba(0,0,0,.6);
  --text:#eef2f9;--text-2:#cdd6e6;--muted:#93a2bb;--line:rgba(255,255,255,.08);
  --primary:#60a5fa;--primary-2:#93c5fd;--primary-soft:rgba(96,165,250,.16);--on-primary:#04122b;
  --grad:linear-gradient(135deg,#0b1d4d 0%,#1e40af 50%,#0284c7 120%);
  --in:#34d399;--in-soft:rgba(52,211,153,.14);--out:#fb7185;--out-soft:rgba(251,113,133,.14);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);--info:#a5b4fc;--info-soft:rgba(165,180,252,.14);
  --c-in:#34d399;--c-out:#fb7185;--c-line:#a5b4fc;
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060a13;--bg-2:#0a1120;
  --glass:rgba(17,25,43,.62);--glass-strong:rgba(19,28,48,.88);--glass-border:rgba(255,255,255,.08);--glass-edge:rgba(255,255,255,.04);
  --surface:#0f1729;--surface-2:rgba(24,34,57,.7);--surface-3:#1a2540;
  --neu:#111a2e;--neu-hi:rgba(255,255,255,.045);--neu-lo:rgba(0,0,0,.6);
  --text:#eef2f9;--text-2:#cdd6e6;--muted:#93a2bb;--line:rgba(255,255,255,.08);
  --primary:#60a5fa;--primary-2:#93c5fd;--primary-soft:rgba(96,165,250,.16);--on-primary:#04122b;
  --grad:linear-gradient(135deg,#0b1d4d 0%,#1e40af 50%,#0284c7 120%);
  --in:#34d399;--in-soft:rgba(52,211,153,.14);--out:#fb7185;--out-soft:rgba(251,113,133,.14);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);--info:#a5b4fc;--info-soft:rgba(165,180,252,.14);
  --c-in:#34d399;--c-out:#fb7185;--c-line:#a5b4fc;
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="green"]{--primary:#34d399;--primary-2:#6ee7b7;--primary-soft:rgba(52,211,153,.15);--on-primary:#022c1f;--grad:linear-gradient(135deg,#022c22 0%,#065f46 50%,#0f766e 120%);--c-line:#38bdf8}
:root:not([data-theme="light"])[data-accent="gold"]{--bg:#07070a;--bg-2:#100e0a;--glass:rgba(24,21,17,.66);--glass-strong:rgba(28,24,19,.9);--neu:#15130f;--surface:#14110d;--surface-3:#231e16;--primary:#e5c160;--primary-2:#f3d98b;--primary-soft:rgba(229,193,96,.15);--on-primary:#1c1404;--grad:linear-gradient(135deg,#0c0a08 0%,#2b2218 45%,#8a6a1f 120%);--c-line:#e5c160}}
:root[data-theme="dark"][data-accent="green"]{--primary:#34d399;--primary-2:#6ee7b7;--primary-soft:rgba(52,211,153,.15);--on-primary:#022c1f;--grad:linear-gradient(135deg,#022c22 0%,#065f46 50%,#0f766e 120%);--c-line:#38bdf8}
:root[data-theme="dark"][data-accent="gold"]{--bg:#07070a;--bg-2:#100e0a;--glass:rgba(24,21,17,.66);--glass-strong:rgba(28,24,19,.9);--neu:#15130f;--surface:#14110d;--surface-3:#231e16;--primary:#e5c160;--primary-2:#f3d98b;--primary-soft:rgba(229,193,96,.15);--on-primary:#1c1404;--grad:linear-gradient(135deg,#0c0a08 0%,#2b2218 45%,#8a6a1f 120%);--c-line:#e5c160}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 600px at -5% -10%,color-mix(in srgb,var(--primary) 26%,transparent),transparent 60%),
    radial-gradient(800px 600px at 105% 5%,color-mix(in srgb,var(--c-line) 18%,transparent),transparent 60%),
    radial-gradient(1000px 700px at 50% 115%,color-mix(in srgb,var(--c-in) 14%,transparent),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{margin-top:16px}.mb{margin-bottom:16px}.gap-s{gap:6px}
:focus-visible{outline:2.5px solid var(--primary-2);outline-offset:2px}

/* glass & neu primitives */
.glass,.card,.auth-card,.side,.sheet,.drawer,.bnav,.topbar.scrolled{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border)}
.neu{background:var(--neu);box-shadow:6px 6px 14px var(--neu-lo),-6px -6px 14px var(--neu-hi)}

/* privasi: sembunyikan nominal */
body.privacy .num:not(input),body.privacy .money-hide{filter:blur(8px);user-select:none;transition:filter .2s}
body.privacy .chart-box canvas{filter:blur(10px)}

/* ---------- layar penuh (setup/login/wizard) ---------- */
#screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{width:100%;max-width:440px;border-radius:28px;padding:30px;box-shadow:var(--shadow-lg)}
.auth-card.wide{max-width:780px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand-logo{width:48px;height:48px;border-radius:15px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;box-shadow:0 10px 24px color-mix(in srgb,var(--primary) 40%,transparent)}
.brand h1{font-size:20px;margin:0;letter-spacing:-.02em}.brand p{margin:0;color:var(--muted);font-size:13px}
.secure-note{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:16px;padding:10px 12px;border-radius:12px;background:var(--in-soft)}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.type-card{border:1px solid var(--glass-border);border-radius:16px;padding:14px;cursor:pointer;background:var(--neu);box-shadow:5px 5px 12px var(--neu-lo),-5px -5px 12px var(--neu-hi);transition:.15s;text-align:left}
.type-card:hover{transform:translateY(-1px)}
.type-card.on{box-shadow:inset 4px 4px 10px var(--neu-lo),inset -4px -4px 10px var(--neu-hi);border-color:var(--primary);color:var(--primary)}
.type-card .e{font-size:26px}.type-card b{display:block;font-size:14px;margin-top:4px;color:var(--text)}.type-card span{font-size:12px;color:var(--muted)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-width:0 1px 0 0;display:flex;flex-direction:column;padding:16px 12px;z-index:40}
.biz-switch{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px solid var(--glass-border);cursor:pointer;width:100%;text-align:left;background:var(--neu);box-shadow:5px 5px 12px var(--neu-lo),-5px -5px 12px var(--neu-hi)}
.biz-switch .e{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--grad);box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 35%,transparent)}
.biz-switch b{display:block;font-size:14px}.biz-switch small{color:var(--muted);font-size:12px}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:3px;overflow:auto;flex:1;padding:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:none;border-radius:13px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:14px;text-align:left;transition:.12s}
.nav button:hover{background:var(--primary-soft)}
.nav button.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.sec-badge{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;padding:8px 10px;border-radius:12px;background:var(--in-soft);color:var(--in)}
.sec-badge.local{background:var(--warn-soft);color:var(--warn)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:14px 28px;border:0;border-bottom:1px solid transparent;transition:background .2s}
.topbar.scrolled{border-width:0 0 1px 0}
.topbar h2{margin:0;font-size:20px;letter-spacing:-.02em}
.topbar .sub{font-size:12px;color:var(--muted)}
.content{padding:8px 28px 40px;max-width:1320px;width:100%}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--glass-border);background:var(--neu);box-shadow:4px 4px 10px var(--neu-lo),-4px -4px 10px var(--neu-hi);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--text-2);flex:none;transition:.12s}
.icon-btn:active,.icon-btn.on{box-shadow:inset 3px 3px 8px var(--neu-lo),inset -3px -3px 8px var(--neu-hi);color:var(--primary)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--c-out);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.mob-only{display:none}

/* bottom nav */
.bnav{display:none;position:fixed;left:10px;right:10px;bottom:calc(8px + var(--safe-b));z-index:50;height:var(--nav-h);border-radius:22px;box-shadow:var(--shadow-lg);grid-template-columns:repeat(5,1fr);align-items:center}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 0}
.bnav button.on{color:var(--primary)}
.bnav .fab{width:56px;height:56px;border-radius:19px;background:var(--grad);color:#fff;margin:-30px auto 0;box-shadow:0 12px 26px color-mix(in srgb,var(--primary) 45%,transparent);display:grid;place-items:center;border:3px solid var(--glass-border)}
.bnav .fab svg{width:26px;height:26px}
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);backdrop-filter:blur(2px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- komponen ---------- */
.card{border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative}
.card h3{margin:0;font-size:15px;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--glass-border);background:var(--neu);color:var(--text);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:.12s;box-shadow:4px 4px 10px var(--neu-lo),-4px -4px 10px var(--neu-hi)}
.btn:hover{color:var(--primary)}
.btn:active{box-shadow:inset 3px 3px 8px var(--neu-lo),inset -3px -3px 8px var(--neu-hi)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--out)}
.btn.danger.solid{background:var(--c-out);color:#fff;border-color:transparent;box-shadow:0 8px 18px color-mix(in srgb,var(--c-out) 35%,transparent)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg.i{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--glass-border);background:var(--neu);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--text-2);box-shadow:3px 3px 8px var(--neu-lo),-3px -3px 8px var(--neu-hi)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 30%,transparent)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.in{background:var(--in-soft);color:var(--in)}.pill.out{background:var(--out-soft);color:var(--out)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-3);color:var(--muted)}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:7px}
.inp,select.inp,textarea.inp{width:100%;padding:12px 14px;border-radius:14px;border:1px solid transparent;background:var(--neu);outline:none;transition:.15s;font-size:15px;box-shadow:inset 3px 3px 7px var(--neu-lo),inset -3px -3px 7px var(--neu-hi)}
.inp:focus{border-color:var(--primary-2)}
textarea.inp{min-height:72px;resize:vertical}
.inp.big{font-size:26px;font-weight:800;padding:12px 14px;letter-spacing:-.02em}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--neu);padding:5px;border-radius:16px;gap:5px;margin-bottom:14px;box-shadow:inset 3px 3px 8px var(--neu-lo),inset -3px -3px 8px var(--neu-hi)}
.seg button{border:0;background:none;padding:9px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--glass-strong);color:var(--text);box-shadow:3px 3px 8px var(--neu-lo),-2px -2px 6px var(--neu-hi)}
.seg button.on.in{color:var(--in)}.seg button.on.out{color:var(--out)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-bottom:14px;max-height:230px;overflow:auto;padding:4px}
.cat-opt{border:1px solid var(--glass-border);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer;background:var(--neu);font-size:12px;font-weight:600;box-shadow:3px 3px 8px var(--neu-lo),-3px -3px 8px var(--neu-hi)}
.cat-opt .e{font-size:20px;display:block}
.cat-opt.on{border-color:var(--primary);color:var(--primary);box-shadow:inset 3px 3px 8px var(--neu-lo),inset -3px -3px 8px var(--neu-hi)}
.switch{position:relative;width:50px;height:29px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--neu);border-radius:999px;transition:.2s;cursor:pointer;box-shadow:inset 2px 2px 6px var(--neu-lo),inset -2px -2px 6px var(--neu-hi)}
.switch i:before{content:"";position:absolute;width:21px;height:21px;left:4px;top:4px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+i{background:var(--grad)}
.switch input:checked+i:before{transform:translateX(21px)}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .t b{display:block;font-size:14px}.set-row .t small{color:var(--muted);font-size:12.5px}
.opt-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.opt-row .acts{display:flex;gap:6px}
.opt-row .acts button{width:34px;height:34px;border-radius:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{flex:1;min-width:120px;border-radius:16px;padding:12px;cursor:pointer;border:2px solid transparent;color:#fff;font-weight:700;font-size:13px;text-align:left}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 3px var(--primary-soft)}

/* hero / kpi */
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:22px;position:relative;overflow:hidden;box-shadow:0 22px 44px color-mix(in srgb,var(--primary) 30%,transparent);border:1px solid rgba(255,255,255,.18)}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);right:-90px;top:-130px}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.12),transparent 40%)}
.hero .lbl{opacity:.9;font-size:13px;font-weight:600;position:relative;display:flex;align-items:center;gap:8px}
.hero .val{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0 14px;position:relative}
.acc-chips{display:flex;gap:8px;overflow-x:auto;position:relative;z-index:1;scrollbar-width:none}
.acc-chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(8px);padding:8px 12px;border-radius:14px;min-width:125px;flex:none}
.acc-chip small{display:block;opacity:.85;font-size:11.5px}.acc-chip b{font-size:14px}
.hero-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;position:relative;z-index:1}
.hero-actions button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);backdrop-filter:blur(8px);color:#fff;border-radius:15px;padding:10px 4px;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.hero-actions button:hover{background:rgba(255,255,255,.26)}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between}
.kpi .k-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi .k-lbl{font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .k-val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.trend{font-size:12px;font-weight:800}
.trend.up{color:var(--in)}.trend.down{color:var(--out)}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:230px}
.legend-note{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.li:last-child{border-bottom:0}
.li:hover{background:var(--primary-soft)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--neu);box-shadow:3px 3px 8px var(--neu-lo),-3px -3px 8px var(--neu-hi)}
.li .t{font-weight:700;font-size:14px}.li .s{font-size:12.5px;color:var(--muted)}
.li .amt{font-weight:800;text-align:right;white-space:nowrap}
.day-h{display:flex;justify-content:space-between;align-items:center;padding:14px 6px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.empty{text-align:center;padding:36px 14px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:6px}
.prog{height:9px;background:var(--neu);border-radius:99px;overflow:hidden;box-shadow:inset 2px 2px 5px var(--neu-lo),inset -2px -2px 5px var(--neu-hi)}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.alert-item{display:flex;gap:12px;padding:12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--glass-border);margin-bottom:10px;cursor:pointer;align-items:flex-start}
.alert-item .ai{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:16px}
.alert-item b{font-size:13.5px;display:block}.alert-item small{color:var(--muted);font-size:12.5px}
.lv-danger{border-left:4px solid var(--c-out)}.lv-warn{border-left:4px solid #f59e0b}.lv-info{border-left:4px solid var(--c-line)}
.lv-danger .ai{background:var(--out-soft)}.lv-warn .ai{background:var(--warn-soft)}.lv-info .ai{background:var(--info-soft)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:800;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:var(--primary-soft)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.tot td{font-weight:800;border-top:2px solid var(--line);background:none}
.tbl-wrap{overflow-x:auto}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:180px}
.search>span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;z-index:1}
.search input{padding-left:42px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.insight:last-child{border:0}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--primary-2) calc(var(--p)*1%),var(--neu) 0);display:grid;place-items:center;flex:none;box-shadow:5px 5px 12px var(--neu-lo),-5px -5px 12px var(--neu-hi)}
.ring>div{width:74px;height:74px;border-radius:50%;background:var(--glass-strong);display:grid;place-items:center;font-weight:800;font-size:17px}
.biz-card{display:flex;flex-direction:column;gap:12px}
.biz-card .top{display:flex;gap:12px;align-items:center}
.biz-card .e{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:var(--grad);box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 30%,transparent)}
.biz-card.active{outline:2px solid var(--primary-2);outline-offset:-1px}

/* kasir */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:2px}
.pcard{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-radius:18px;padding:12px;cursor:pointer;position:relative;transition:.12s;user-select:none;display:flex;flex-direction:column;gap:6px;min-height:122px;box-shadow:var(--shadow)}
.pcard:hover{transform:translateY(-2px)}.pcard:active{transform:scale(.97)}
.pcard .pe{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:15px}
.pcard b{font-size:13.5px;line-height:1.3}
.pcard .pp{font-weight:800;color:var(--primary);font-size:14px;margin-top:auto}
.pcard .ps{font-size:11.5px;color:var(--muted)}
.pcard .q{position:absolute;top:8px;right:8px;background:var(--grad);color:#fff;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.pcard.low .ps{color:var(--out);font-weight:700}
.cart{position:sticky;top:84px}
.cart-items{max-height:calc(100vh - 380px);overflow:auto}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;border-radius:12px;overflow:hidden;background:var(--neu);box-shadow:inset 2px 2px 5px var(--neu-lo),inset -2px -2px 5px var(--neu-hi)}
.qty button{width:30px;height:30px;border:0;background:none;cursor:pointer;font-weight:800;color:var(--primary)}
.qty input{width:44px;text-align:center;border:0;background:none;height:30px;font-weight:700;outline:none}
.cart-bar{display:none}
.total-line{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.pay-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:12px;padding:2px}
.pay-opt{border:1px solid var(--glass-border);border-radius:14px;padding:10px;cursor:pointer;font-weight:700;font-size:13px;background:var(--neu);text-align:center;box-shadow:3px 3px 8px var(--neu-lo),-3px -3px 8px var(--neu-hi)}
.pay-opt.on{border-color:var(--primary);color:var(--primary);box-shadow:inset 3px 3px 8px var(--neu-lo),inset -3px -3px 8px var(--neu-hi)}
.quick-cash{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}

/* modal / drawer */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.5);backdrop-filter:blur(4px)}
#modal.open{display:flex}
.sheet{background:var(--glass-strong);border-radius:24px;width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
.sheet.wide{max-width:780px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:17px}
.sheet-b{padding:18px;overflow:auto}
.sheet-f{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .2s}
.toast.err{background:var(--c-out);color:#fff}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--glass-strong);z-index:70;transform:translateX(105%);transition:.25s;display:flex;flex-direction:column;border-width:0 0 0 1px}
.drawer.on{transform:none}
.loader{width:42px;height:42px;border-radius:50%;border:4px solid var(--surface-3);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--neu);border-radius:14px;padding:14px;white-space:pre-wrap;box-shadow:inset 3px 3px 8px var(--neu-lo),inset -3px -3px 8px var(--neu-hi)}

/* kunci PIN */
#lock{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(32px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%)}
#lock.on{display:flex}
.lock-card{width:100%;max-width:340px;text-align:center;border-radius:28px;padding:28px 22px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0 22px}
.pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--neu);box-shadow:inset 2px 2px 4px var(--neu-lo),inset -2px -2px 4px var(--neu-hi)}
.pin-dots i.f{background:var(--grad);box-shadow:none}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.keypad button{height:62px;border-radius:20px;border:1px solid var(--glass-border);font-size:22px;font-weight:700;background:var(--neu);cursor:pointer;box-shadow:5px 5px 12px var(--neu-lo),-5px -5px 12px var(--neu-hi)}
.keypad button:active{box-shadow:inset 4px 4px 10px var(--neu-lo),inset -4px -4px 10px var(--neu-hi)}

/* ---------- responsif ---------- */
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-dash{grid-template-columns:minmax(0,1fr)}
  .pos{grid-template-columns:minmax(0,1fr) 320px}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  html,body{overflow-x:hidden}
  .side{position:fixed;left:0;top:0;bottom:0;width:290px;max-width:86vw;height:100%;transform:translateX(-105%);transition:transform .25s;box-shadow:var(--shadow-lg);padding-top:calc(16px + env(safe-area-inset-top,0px));z-index:75;background:var(--glass-strong)}
  .side.on{transform:none}
  .bnav{display:grid}
  .mob-only{display:grid}
  .desk-only{display:none!important}
  .topbar{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topbar h2{font-size:18px}
  .content{padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 34px)}
  .pos{grid-template-columns:1fr}
  .pos .cart{display:none}
  .cart-bar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);z-index:45;background:var(--grad);color:#fff;border-radius:18px;padding:12px 16px;align-items:center;gap:10px;box-shadow:0 14px 30px color-mix(in srgb,var(--primary) 40%,transparent);cursor:pointer;font-weight:700}
  #toast{bottom:calc(var(--nav-h) + var(--safe-b) + 26px)}
  .card,.pcard,.auth-card,.bnav{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
}
@media (max-width:640px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{gap:10px}
  .card{padding:15px;border-radius:18px}
  .kpi .k-val{font-size:18px}
  .hero .val{font-size:28px}
  #modal{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{max-width:none;border-radius:24px 24px 0 0;max-height:94vh;animation:up .22s ease-out}
  .sheet-f{padding-bottom:calc(14px + var(--safe-b))}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl{font-size:13px}
  .hide-sm{display:none}
  .chart-box{height:240px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;color:#000}
  .side,.topbar,.bnav,.no-print,.cart-bar,#toast{display:none!important}
  .app{display:block}.content{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ddd;background:#fff;backdrop-filter:none;break-inside:avoid}
  .print-only{display:block!important}
  body.privacy .num{filter:none}
}
.print-only{display:none}
</style>
</head>
<body>
<div id="screen"><div class="loader"></div></div>
<div id="app" class="app hidden"></div>
<div id="scrim" class="scrim" onclick="closeOverlays()"></div>
<div id="drawer" class="drawer"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="lock"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
